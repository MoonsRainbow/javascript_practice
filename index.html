<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<title>Memontum</title>
		<link
			rel="stylesheet"
			href="css/style.css"
		/>
	</head>
	<body>
		<form
			id="login-form"
			class="hidden"
		>
			<input
				id="username"
				type="text"
				placeholder="What is your name?"
				required
				minlength="3"
				maxlength="15"
			/>
			<input
				type="submit"
				value="Log In"
			/>
		</form>
		<h1
			id="greeting"
			class="hidden"
		></h1>
		<script src="js/greetings.js"></script>
	</body>
</html>
