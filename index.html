<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<title>Memontum</title>
		<link
			rel="stylesheet"
			href="css/style.css"
		/>
	</head>
	<body>
		<div class="clock">
			<h2 id="clock__date">0000.00.00 (0)</h2>
			<h2 id="clock__time">00:00</h2>
		</div>
		<form
			id="login-form"
			class="hidden"
		>
			<input
				id="username"
				type="text"
				placeholder="What is your name?"
				required
				minlength="3"
				maxlength="15"
			/>
			<input
				type="submit"
				value="Log In"
			/>
		</form>

		<h1
			id="greeting"
			class="hidden"
		></h1>
		<script src="js/greetings.js"></script>
		<script src="js/clock.js"></script>
	</body>
</html>
